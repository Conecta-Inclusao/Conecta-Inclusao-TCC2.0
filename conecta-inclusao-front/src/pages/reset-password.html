<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a56b8">
    <title>Redefinir senha | Conecta Inclusao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/login-paciente.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script src="../assets/js/acessibilidade.js"></script>
</head>
<body class="auth-page auth-page--single">
    <a class="skip-link" href="#conteudo">Pular para o formulário</a>

    <main class="auth-main" id="conteudo">
        <div class="login-container">
            <div class="back-button">
                <a href="lndex.html"><i class="ph ph-arrow-left" aria-hidden="true"></i> Voltar para o início</a>
            </div>

            <div class="login-header">
                <i class="ph ph-lock-key" aria-hidden="true"></i>
                <h1>Redefinir senha</h1>
                <p>Informe o token recebido por e-mail e crie uma nova senha.</p>
            </div>

            <form id="resetPasswordForm">
                <div class="input-group">
                    <label for="resetToken">Token de recuperação</label>
                    <input type="text" id="resetToken" placeholder="Cole o token recebido" required>
                </div>
                <div class="input-group">
                    <label for="newPassword">Nova senha</label>
                    <input type="password" id="newPassword" data-password-guidance="true"
                           autocomplete="new-password" placeholder="Nova senha segura" required>
                </div>
                <div class="input-group">
                    <label for="confirmPassword">Confirmar senha</label>
                    <input type="password" id="confirmPassword" autocomplete="new-password"
                           placeholder="Repita a nova senha" required>
                </div>
                <button type="submit" class="btn-login">Salvar nova senha</button>
            </form>
        </div>
    </main>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/session.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/reset-password.js"></script>
</body>
</html>
