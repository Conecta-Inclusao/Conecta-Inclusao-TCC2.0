<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#b96210">
    <title>Cadastro de Clinica | Conecta Inclusao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/cadastro-empresa.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script src="../assets/js/acessibilidade.js"></script>
</head>
<body class="auth-page auth-page--single">
    <a class="skip-link" href="#conteudo">Pular para o formulário</a>
    <main class="register-container" id="conteudo">
        <div class="register-card">
            <div class="register-header">
                <div class="back-button">
                    <a href="login-empresa.html"><i class="ph ph-arrow-left"></i> Voltar</a>
                </div>
                <div class="company-icon">
                    <i class="ph ph-building"></i>
                </div>
                <h1>Cadastro da Empresa</h1>
                <p>Crie seu acesso corporativo para gerir saúde ocupacional e convênios médicos.</p>
            </div>

            <form id="registerCompanyForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="companyName">Nome da Empresa</label>
                        <input type="text" id="companyName" placeholder="Nome fantasia" required>
                    </div>
                    <div class="input-group">
                        <label for="companyLegalName">Razão Social</label>
                        <input type="text" id="companyLegalName" placeholder="Razão social" required>
                    </div>
                    <div class="input-group">
                        <label for="cnpj">CNPJ</label>
                        <input type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18" required>
                    </div>
                    <div class="input-group">
                        <label for="companyEmail">E-mail Corporativo</label>
                        <input type="email" id="companyEmail" placeholder="contato@empresa.com.br" required>
                    </div>
                    <div class="input-group">
                        <label for="companyPhone">Telefone</label>
                        <input type="tel" id="companyPhone" placeholder="(00) 00000-0000" required>
                    </div>
                    <div class="input-group">
                        <label for="companyContact">Responsável</label>
                        <input type="text" id="companyContact" placeholder="Nome do responsável" required>
                    </div>
                    <div class="input-group">
                        <label for="contactRole">Cargo do Responsável</label>
                        <input type="text" id="contactRole" placeholder="Ex: RH, Gestor de Saúde" required>
                    </div>
                    <div class="input-group">
                        <label for="companyBranch">Ramo de Atuação</label>
                        <!-- Placeholder com termos de saude: o campo descreve a
                             area de atuacao de uma CLINICA, nao de uma empresa
                             qualquer. "Indústria, Serviços, Comércio" induzia ao
                             preenchimento errado. -->
                        <input type="text" id="companyBranch" placeholder="Ex: Clínica Pediátrica, Reabilitação, Fonoaudiologia" required>
                    </div>

                    <!-- O CEP vem antes do restante do endereco porque e ele que
                         preenche os demais campos: pedir a rua primeiro faz o
                         usuario digitar o que o proprio formulario ia completar. -->
                    <div class="input-group">
                        <label for="zip">CEP</label>
                        <input type="text" id="zip" placeholder="00000-000" maxlength="9" inputmode="numeric" autocomplete="postal-code" required>
                        <small class="field-hint" id="zipHint">Digite o CEP para preencher o endereço automaticamente.</small>
                    </div>
                    <div class="input-group">
                        <label for="street">Endereço (rua/avenida)</label>
                        <input type="text" id="street" placeholder="Rua, avenida ou logradouro" autocomplete="address-line1" required>
                    </div>
                    <div class="input-group">
                        <label for="city">Cidade</label>
                        <input type="text" id="city" placeholder="Cidade" autocomplete="address-level2" required>
                    </div>
                    <div class="input-group">
                        <label for="state">Estado</label>
                        <input type="text" id="state" placeholder="UF" maxlength="2" autocomplete="address-level1" required>
                    </div>
                    <div class="input-group full-width">
                        <label class="switch-field" for="hasStreetNumber">
                            <span class="switch-field-text">
                                <strong>O endereço possui número?</strong>
                                <small>Desligue para endereços sem número (registrado como “s/n”).</small>
                            </span>
                            <span class="switch-control">
                                <input type="checkbox" id="hasStreetNumber" checked
                                       aria-controls="streetNumberField">
                                <span class="switch-track" aria-hidden="true"></span>
                            </span>
                        </label>
                    </div>
                    <div class="input-group" id="streetNumberField" data-switch-target>
                        <label for="streetNumber">Número</label>
                        <input type="text" id="streetNumber" placeholder="Ex: 1250" maxlength="10" inputmode="numeric" autocomplete="address-line2">
                    </div>
                    <div class="input-group">
                        <label for="addressComplement">Complemento <span class="optional-tag">(opcional)</span></label>
                        <input type="text" id="addressComplement" placeholder="Sala, bloco, andar" maxlength="60">
                    </div>
                    <div class="input-group full-width">
                        <label for="password">Senha</label>
                        <input type="password" id="password" data-password-guidance="true" placeholder="Senha forte (8+ caracteres, maiúscula, minúscula, número e especial)" required>
                    </div>
                    <div class="input-group full-width">
                        <label for="confirmPassword">Confirmar Senha</label>
                        <input type="password" id="confirmPassword" placeholder="Confirme sua senha" required>
                    </div>
                </div>

                <button type="submit" class="btn-register">Criar Conta</button>
                <p class="register-note">Após o cadastro, o acesso será validado pela equipe administrativa e você poderá usar o portal empresarial.</p>
            </form>
        </div>
    </main>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/session.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/cadastro-empresa.js"></script>
</body>
</html>
